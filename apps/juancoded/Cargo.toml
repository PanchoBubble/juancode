[workspace]
resolver = "2"
members = [
    "crates/juancoded",
    "crates/juancoded-cordis",
    "crates/juancoded-core",
    "crates/juancoded-persistence",
    "crates/juancoded-plugins",
    "crates/juancoded-server",
    "crates/juancoded-state",
    "crates/juancoded-vt",
    "crates/juancoded-transcripts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
juancoded-cordis = { path = "crates/juancoded-cordis" }
juancoded-core = { path = "crates/juancoded-core" }
juancoded-persistence = { path = "crates/juancoded-persistence" }
juancoded-plugins = { path = "crates/juancoded-plugins" }
juancoded-server = { path = "crates/juancoded-server" }
juancoded-state = { path = "crates/juancoded-state" }
juancoded-vt = { path = "crates/juancoded-vt" }

alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures = "0.3"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
juancoded-transcripts = { path = "crates/juancoded-transcripts" }

[profile.release]
lto = "thin"
