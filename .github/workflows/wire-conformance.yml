name: wire-conformance

# The wire protocol is the contract between the core (apps/juancoded) and every
# client. This workflow runs the executable spec: the fast checks everywhere, and
# the live conformance suite against a real core booted in the runner. The Swift
# package's own XCTest suite rides along in its own job, because nothing else in
# .github/workflows runs it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wire-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The checklist is generated, so a stale one in the tree is a real error.
      # This catches a hand-edited checklist and nothing else: it regenerates FROM
      # the status JSON, so a status JSON whose measurement is out of date passes
      # here. The conformance jobs below are what check the measurement itself.
      - name: Parity checklist is up to date
        run: |
          pnpm --filter @juancode/wire-conformance parity
          git diff --exit-code -- apps/wire-conformance/parity

  cross-target:
    name: cross-target compile (linux)
    # Nothing on a macOS dev machine ever type-checks the cfg(target_os = "linux")
    # arm of juancoded-core/src/proc.rs, and for six days it held a hard E0283 that
    # no local build could see. The Rust conformance job below does compile it, but
    # only as a side effect on its way to booting a core, so the failure reads as
    # "conformance broke" and it dies behind a pnpm install. This job exists to say
    # the one thing plainly: the tree does not compile for Linux.
    #
    # ubuntu-24.04 rather than ubuntu-latest on purpose: --target x86_64-unknown-linux-gnu
    # is only free while the runner is natively x86_64, and rusqlite is bundled, so a
    # runner-arch flip would turn this into a real cross-compile needing a C toolchain.
    #
    # The mirror gap is knowingly left open: the cfg(target_os = "macos") arm is
    # compiled by no CI job at all, only by every local build on this all-Mac team.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: cargo --version && rustc --version && rustc -vV | grep host

      - name: Type-check the whole workspace for Linux
        working-directory: apps/juancoded
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo check --workspace --all-targets --target x86_64-unknown-linux-gnu

  swift-tests:
    # The Swift package's XCTest suite. Until it existed as a step, NOTHING in
    # .github/workflows ran `swift test`: the suite was never a gate, and two
    # suites had been red on main for as long as they had existed while main
    # reported green (juancode-rzuw, juancode-h52n).
    #
    # It used to be the last step of `conformance vs the Swift core`, folded in so
    # it could reuse that job's warm toolchain and module graph. juancode-nqpm
    # deleted the Swift core, so the conformance steps it was riding on are gone
    # and this is a job of its own — which is also the moment its
    # branch-protection context moves, from "conformance vs the Swift core" to
    # this job's name. A required check that can never run again blocks every PR.
    name: swift tests
    runs-on: macos-15 # default Xcode 16.x -> Swift 6 tools
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      # Separate from the test step so a compile failure reads differently from a
      # failing assertion.
      - name: Build
        working-directory: apps/native
        run: swift build

      - name: Run the XCTest suite
        working-directory: apps/native
        run: swift test

  conformance-rust:
    name: conformance vs the Rust core
    # Linux, not macos-15: juancoded is cfg(unix) and rusqlite is bundled, so it
    # needs a C compiler and no Xcode. That keeps this job off the scarce macOS
    # runners (and off their 10x minute multiplier on a private repo) and out of a
    # Swift toolchain warm-up it would never use.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Toolchain
        run: cargo --version && rustc --version

      # Cold, this is the long step. The suite would build it itself, but doing it
      # here keeps the build failure separate from a conformance failure.
      - name: Build the Rust core
        working-directory: apps/juancoded
        run: cargo build --bin juancoded

      - name: Run the conformance suite
        env:
          # Its own port, never 4280/4281, which are a developer's app.
          JUANCODE_CONFORMANCE_CORE: rust
          JUANCODE_CONFORMANCE_SKIP_BUILD: "1"
          # Three attempts at every scenario, all inside the one boot above. A
          # single green run has twice been reported as the gate and turned out not
          # to be repeatable (juancode-g2kl, juancode-p5vb: tracked-prs was 20 of 20
          # one day and 2 of 6 the next), so the suite measures instead of trusting.
          # And one reason of this core's own: the only mid-run core death anyone
          # has seen was here, once in six passes of the spec (juancode-jyl9).
          # Scoring it on a single pass sampled the flakiest thing in the repo the
          # least, while being a required check on main.
          # Six would catch a 1-in-6 death 67% of the time instead of 42%, but it
          # doubles the wall clock of a required check to chase a flake it already
          # samples three times per merge.
          JUANCODE_CONFORMANCE_REPEAT: "3"
          JUANCODE_CONFORMANCE_PORT: "4300"
          JUANCODE_CONFORMANCE_LABEL: rust
          JUANCODE_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-rust.md
          JUANCODE_CONFORMANCE_STATUS: ${{ github.workspace }}/conformance-rust-status.json
        run: pnpm --filter @juancode/wire-conformance test:conformance

      - name: Committed parity file still describes the core
        working-directory: apps/wire-conformance
        run: pnpm exec tsx src/parity-cli.ts --verify ${{ github.workspace }}/conformance-rust-status.json

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-conformance-rust
          path: |
            conformance-rust.md
            conformance-rust-status.json
          if-no-files-found: warn
